name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A real Redis for backend/tests/redis (rate limiter, timeline cache, ioredis client). Locally those
    # tests start their own redis-server, or skip when it is not installed.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: install (one npm workspaces install for shared, backend, frontend)
        run: npm ci
      - name: lint (errors fail the build; warnings are reported)
        run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: frontend build and bundle budget
        working-directory: frontend
        run: npm run build
        env:
          BUDGET_STRICT: "1"

  e2e:
    # Browser run of scripts/e2e.mjs against a real API + SSR site: sign-in, every admin tab,
    # share dialog, member restrictions, planner, settings, no sideways scroll, no page errors.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: playwright (chromium only; kept out of package.json so the app install stays small)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm i playwright@1.49.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: build site
        working-directory: frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=2048
      - name: start api + site + edge
        run: |
          # Embedded PGlite accounts store, no Redis, pinned setup code; no secrets needed.
          mkdir -p backend/data
          (cd backend && SETUP_CODE=CIE2E0001 WARM_CACHE=0 JOB_MIN_FREE_GB=0 LOG_LEVEL=warn \
            node --experimental-strip-types --import ./register.mjs src/server.ts > /tmp/api.log 2>&1 &)
          (cd frontend && HOST=127.0.0.1 PORT=3100 node .output/server/index.mjs > /tmp/web.log 2>&1 &)
          (EDGE_HOST=127.0.0.1 EDGE_PORT=3000 node scripts/serve.mjs > /tmp/edge.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/readyz >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/readyz
      - name: seed super admin + one member
        run: |
          H='content-type: application/json'
          curl -sf -c /tmp/a.jar -H "$H" -H 'sec-fetch-site: same-origin' -d '{"code":"CIE2E0001","email":"owner@ci.local","name":"Owner","password":"ci-owner-pass-1"}' http://127.0.0.1:3000/api/auth/setup >/dev/null
          curl -sf -b /tmp/a.jar -H "$H" -H 'sec-fetch-site: same-origin' -d '{"email":"member@ci.local","name":"Member","password":"ci-member-pass-1"}' http://127.0.0.1:3000/api/admin/members >/dev/null
      - name: seed the member's planner (so e2e screenshots show real pages, not empty states)
        run: node --experimental-strip-types scripts/seed-ink-demo.ts member@ci.local ci-member-pass-1 http://127.0.0.1:3000
      - name: lighthouse (against the real API + SSR stack; the sign-in page is public)
        run: npx --yes @lhci/cli@0.14.0 autorun
      - name: "replay smoke (synthetic board lesson in the real player - strokes, undo, erase-all, shape, blank page, resize)"
        run: |
          node --experimental-strip-types scripts/replay-fixture.ts /tmp/replay-fixture.json
          ffmpeg -loglevel error -y -f lavfi -i color=c=black:s=320x180:r=10 -t 12 -c:v libvpx -b:v 50k -an /tmp/replay.webm
          node scripts/replay-smoke.mjs --shots e2e-shots/replay
        env:
          PLAYWRIGHT_DIR: /tmp/pw
          REPLAY_FIXTURE: /tmp/replay-fixture.json
          REPLAY_VIDEO: /tmp/replay.webm
          E2E_BASE: http://127.0.0.1:3000
          E2E_MEMBER: member@ci.local:ci-member-pass-1
      - name: e2e (no retries — a flake fails the job so it gets fixed, not masked; on failure a screenshot, console log and trace land in e2e-shots)
        run: node scripts/e2e.mjs --shots e2e-shots
        env:
          PLAYWRIGHT_DIR: /tmp/pw
          E2E_RETRIES: "0"
          E2E_TRACE: "1"
          E2E_BASE: http://127.0.0.1:3000
          E2E_ADMIN: owner@ci.local:ci-owner-pass-1
          E2E_MEMBER: member@ci.local:ci-member-pass-1
      - name: logs on failure
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/web.log /tmp/edge.log || true
      - name: visual diff vs main's last green e2e (warn-only; which pages moved, and by how much, lands in the job summary)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --branch main --workflow ci.yml --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -z "$RUN" ]; then echo "no green run on main yet; nothing to compare" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          mkdir -p baseline-shots
          if ! gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n e2e-shots -D baseline-shots 2>/dev/null; then
            echo "main run $RUN has no e2e-shots artifact (expired?); nothing to compare" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "baseline: main run $RUN"
          node scripts/visual-diff.mjs baseline-shots e2e-shots e2e-shots/visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-shots
          path: e2e-shots
          if-no-files-found: ignore
      - name: e2e report (JUnit -> job summary)
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: e2e
          path: e2e-shots/junit.xml
          reporter: java-junit
          fail-on-error: false

